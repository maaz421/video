<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message</title>

<style>
body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    font-family:Arial,sans-serif;
}

h1{
    color:white;
    cursor:pointer;
    text-align:center;
    font-size:40px;
    transition:0.5s;
}
</style>

<script>
function changeMessage() {
    document.getElementById("msg").innerHTML = "I am full boring 😴";
}
</script>

</head>
<body>

<h1 id="msg" onclick="changeMessage()">
    Hello My Dear Fav Sister ❤️
</h1>

</body>
</html>
